services:
  datum-web:
    build: .
    image: datum-correction-web:latest
    container_name: datum-correction-web
    ports:
      - "8000:8000"
    environment:
      DATUM_DB: /data/datum.db
      DATUM_POINT: D0
      SPAN_LIMIT: "20"
      LOAD_SAMPLE_ON_EMPTY: "1"
    volumes:
      - datum-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  datum-data:
